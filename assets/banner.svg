<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: rotateSweep 10s linear infinite;
    }
    .pulse-node {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    .pulse-node-2 {
      animation: pulseAnim 2.5s ease-in-out infinite alternate 1.2s;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 20s linear infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite alternate;
    }

    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseAnim {
      0% { r: 4px; opacity: 0.3; }
      50% { r: 8px; opacity: 0.8; }
      100% { r: 5px; opacity: 0.5; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -300; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      100% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Matrix/Grid Background lines -->
  <g stroke="#1a2744" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Network Background Constellation (Right / Side Layer) -->
  <g opacity="0.55">
    <!-- Connecting network lines -->
    <path d="M 820 90 L 930 140 L 1040 180 L 1130 110 L 1020 70 Z" fill="none" stroke="#22d3ee" stroke-width="1.2" class="flow-line"/>
    <path d="M 930 140 L 950 250 L 1040 180 L 1090 270 L 1180 210" fill="none" stroke="#818cf8" stroke-width="1.2" class="flow-line"/>

    <!-- Radar Rings (Background at 1040, 180) -->
    <circle cx="1040" cy="180" r="130" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.2"/>
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
    <circle cx="1040" cy="180" r="50" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.45"/>
    <circle cx="1040" cy="180" r="15" fill="none" stroke="#38ef7d" stroke-width="1.5" opacity="0.7"/>

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-sweep">
      <line x1="1040" y1="180" x2="1170" y2="180" stroke="url(#cyberCyan)" stroke-width="2" filter="url(#subtleGlow)" opacity="0.7"/>
    </g>

    <!-- OSINT Constellation Target Nodes -->
    <circle cx="820" cy="90" r="6" fill="#00f2fe" class="pulse-node" filter="url(#glow)"/>
    <circle cx="930" cy="140" r="5" fill="#38ef7d" class="pulse-node-2" filter="url(#glow)"/>
    <circle cx="1040" cy="180" r="7" fill="#f43f5e" class="pulse-node" filter="url(#glow)"/>
    <circle cx="1130" cy="110" r="5" fill="#a855f7" class="pulse-node-2"/>
    <circle cx="950" cy="250" r="6" fill="#38bdf8" class="pulse-node"/>
    <circle cx="1090" cy="270" r="5" fill="#f59e0b" class="pulse-node-2"/>
    <circle cx="1180" cy="210" r="4" fill="#10b981"/>

    <!-- Floating Particles -->
    <circle cx="780" cy="220" r="2.5" fill="#38ef7d" class="particle"/>
    <circle cx="860" cy="300" r="3" fill="#00f2fe" class="particle"/>
    <circle cx="1150" cy="50" r="2" fill="#e0e7ff" class="particle"/>
  </g>

  <!-- Left / Center Foreground Elements (Guaranteed safe from overlaps) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="265" height="30" rx="15" fill="#111c35" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="5" fill="#10b981" filter="url(#subtleGlow)"/>
      <text x="30" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">OSINT RECONNAISSANCE &amp; INTEL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      Awesome OSINT &amp; Username
    </text>
    <text x="0" y="180" fill="url(#cyberCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Search Intelligence
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Curated cross-platform handle enumeration, social correlation, identity mapping &amp; digital footprints
    </text>

    <!-- Tag Pills / Feature Badges -->
    <g transform="translate(0, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔎 3,000+ Platforms</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="194" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">☁️ SaaS &amp; Open-Source</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="369" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Identity Intel</text>

      <!-- Pill 4 -->
      <rect x="525" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="539" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Real-time Lookups</text>
    </g>

    <!-- Meta / Verification Line -->
    <g transform="translate(0, 316)">
      <circle cx="6" cy="0" r="4" fill="#38ef7d"/>
      <text x="18" y="4" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Active 2026 Edition • Verified Toolsets • Research &amp; Cybersecurity Ready
      </text>
    </g>
  </g>

  <!-- Subtle border outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
